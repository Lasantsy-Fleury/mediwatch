version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: mediwatch-postgres
    environment:
      POSTGRES_USER: mediwatch
      POSTGRES_PASSWORD: mediwatch2024
      POSTGRES_DB: mediwatch_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediwatch"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: